services:
  # The full Magento installation including Nginx, php-fpm, mysql, elasticsearch.
  magento:
    container_name: magento
    image: michielgerritsen/mage-os-community-edition:php85-fpm-mage-os3.6.0-sample-data
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    environment:
      - ES_JAVA_OPTS=-Xmx1G # We need this es for indexing, but dont use it further.
      - URL=${MAGENTO_URL}/
      - FLAT_TABLES=true
      # There is no mailserver, allow existing customers to login in the checkout and
      # remove the head include of the sample data, Rapidez renders it on every page.
      - "CUSTOM_ENTRYPOINT_COMMAND=magerun2 config:store:set system/smtp/disable 1; magerun2 config:store:set checkout/options/enable_guest_checkout_login 1; magerun2 config:store:delete design/head/includes"
    volumes:
      - magento-www:/data
      - ../../.docker/magento/entrypoints/:/entrypoints/
      - ../../.docker/entrypoint:/entrypoint
    entrypoint: ['/entrypoint', 'bash /data/entrypoint.sh']
    networks:
      - default

volumes:
  magento-www:
