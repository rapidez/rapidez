services:
  # Automatically route incoming requests based on their labels.
  # Remove this and the labels if you want to route the requests manually.
  traefik:
    container_name: traefik
    image: traefik:v3
    restart: unless-stopped
    # Traefik listens on the same port within the Docker network so the URLs
    # also work from within the containers, for example for the image resizer.
    command: --providers.docker --providers.docker.exposedbydefault=false --entrypoints.web.address=:${TRAEFIK_PORT:-80}
    networks:
      default:
        aliases:
          - ${RAPIDEZ_HOST}
          - ${MAGENTO_HOST}
          - ${ELASTICSEARCH_HOST}
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-80}:${TRAEFIK_PORT:-80}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
